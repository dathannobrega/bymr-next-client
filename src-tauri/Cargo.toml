[package]
name = "bymr_client_next"
version = "0.1.0"
description = "BYMR Next Client (Tauri + TypeScript + Pixi)"
authors = ["Dathan"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "3"

[features]
custom-protocol = ["tauri/custom-protocol"]
